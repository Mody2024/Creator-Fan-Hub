name: Free CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies without paid services
        run: npm install --no-audit --no-fund
      - name: Validate repository integration and automated tests
        run: npm run check && npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build Next.js app
        run: npm run build

  build-media-worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build isolated Raye2 media worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.raye2-media-worker
          push: false
          tags: raye2-media-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
