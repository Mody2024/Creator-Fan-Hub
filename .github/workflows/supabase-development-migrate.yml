name: Supabase development migration gate

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Inspect pending migrations or apply them to the development project"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirm_apply:
        description: "Type APPLY_DEVELOPMENT only after reviewing the dry-run output"
        required: false
        type: string
      confirm_backup:
        description: "Type BACKUP_VERIFIED only after a fresh encrypted backup was downloaded and checked"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: raye2-supabase-development-migrations
  cancel-in-progress: false

jobs:
  migrate-development:
    name: Review and optionally apply development migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: scxkgybuodhuohcxpfat
      REQUESTED_ACTION: ${{ inputs.action }}
      CONFIRM_APPLY: ${{ inputs.confirm_apply }}
      CONFIRM_BACKUP: ${{ inputs.confirm_backup }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate owner credentials and explicit apply gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as GitHub Actions secrets."
            exit 1
          fi
          if [[ "$REQUESTED_ACTION" == "apply" ]]; then
            [[ "$CONFIRM_APPLY" == "APPLY_DEVELOPMENT" ]] || {
              echo "::error::Apply requires confirm_apply=APPLY_DEVELOPMENT."
              exit 1
            }
            [[ "$CONFIRM_BACKUP" == "BACKUP_VERIFIED" ]] || {
              echo "::error::Apply requires confirm_backup=BACKUP_VERIFIED."
              exit 1
            }
          fi
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Link only the dedicated development project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Print local and remote migration history
        run: supabase migration list
      - name: Dry-run pending development migrations
        run: supabase db push --dry-run
      - name: Apply reviewed migrations to development only
        if: inputs.action == 'apply'
        run: supabase db push --yes
      - name: Verify remote migration history after apply
        if: inputs.action == 'apply'
        run: supabase migration list
